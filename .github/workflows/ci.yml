# Every push: run the corrlib tests and the Iberian dataset pipeline tests, then
# build the pipeline's Docker image and run the tests inside it.
name: CI

on:
  push:
  pull_request:

jobs:
  corrlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy scipy pandas matplotlib scikit-learn pytest
      - run: python -m pytest 003-corrlib-correlation-toolbox/tests -q

  dataset-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 007-spanish-solar-portfolio/iberia_datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # synthetic GRIB -> anemoi-datasets create -> Zarr -> quality checks, no credentials needed
      - run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    needs: dataset-pipeline
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iberia-datasets 007-spanish-solar-portfolio/iberia_datasets
      - run: docker run --rm iberia-datasets
